<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open in Dialog Lab</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?display=swap&family=Montserrat:wght@500;600;700" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Montserrat, system-ui, sans-serif;
      background: #16062a;
      color: #fff;
      text-align: center;
      padding: 32px 24px;
    }
    main { max-width: 28rem; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { margin: 0 0 24px; line-height: 1.5; color: rgba(255,255,255,0.82); }
    a.button {
      display: inline-block;
      background: #fff;
      color: #3a1683;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      padding: 14px 28px;
    }
    a.home { display: block; margin-top: 20px; color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Page not found</h1>
    <p id="copy">That link doesn’t match a page on this site.</p>
    <p><a class="button" id="cta" href="/">Go to Dialog Lab</a></p>
    <a class="home" href="/">joindialoglab.com</a>
  </main>
  <script>
    (function () {
      var match = location.pathname.match(
        /^\/topics\/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\/?$/
      );
      if (!match) return;
      var appURL = "dialoguelab://topics/" + match[1];
      document.title = "Open in Dialog Lab";
      document.getElementById("title").textContent = "Continue in Dialog Lab";
      document.getElementById("copy").textContent =
        "This topic opens in the Dialog Lab app. Tap below if it doesn’t open automatically.";
      var cta = document.getElementById("cta");
      cta.textContent = "Open in Dialog Lab";
      cta.setAttribute("href", appURL);
      window.location.replace(appURL);
    })();
  </script>
</body>
</html>
